<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="crtGlow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#62C8AA" />
      <stop offset="68%" stop-color="#4EB89B" />
      <stop offset="100%" stop-color="#287660" />
    </radialGradient>
    <filter id="phosphor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Dark CRT Bezel -->
  <rect width="512" height="512" rx="96" fill="#0A261E" />

  <!-- Inner 1999 Teal Phosphor CRT Screen -->
  <rect x="34" y="34" width="444" height="444" rx="68" fill="url(#crtGlow)" stroke="#E2F6C2" stroke-width="10" />

  <!-- Subtle CRT Scanlines -->
  <g fill="#071C16" opacity="0.16">
    <rect x="40" y="72" width="432" height="6" />
    <rect x="40" y="100" width="432" height="6" />
    <rect x="40" y="128" width="432" height="6" />
    <rect x="40" y="156" width="432" height="6" />
    <rect x="40" y="184" width="432" height="6" />
    <rect x="40" y="212" width="432" height="6" />
    <rect x="40" y="240" width="432" height="6" />
    <rect x="40" y="268" width="432" height="6" />
    <rect x="40" y="296" width="432" height="6" />
    <rect x="40" y="324" width="432" height="6" />
    <rect x="40" y="352" width="432" height="6" />
    <rect x="40" y="380" width="432" height="6" />
    <rect x="40" y="408" width="432" height="6" />
    <rect x="40" y="436" width="432" height="6" />
  </g>

  <!-- Top Retro Status Header Bar -->
  <rect x="76" y="76" width="360" height="46" fill="#E3DCE1" stroke="#1E1A1B" stroke-width="6" />
  <text x="256" y="108" text-anchor="middle" fill="#5A181E" font-family="monospace, sans-serif" font-weight="900" font-size="28" letter-spacing="6">NOWHERE OS</text>

  <!-- Giant Glowing 1999 AI Typography -->
  <g filter="url(#phosphor)">
    <text x="256" y="252" text-anchor="middle" fill="#E2F6C2" font-family="monospace, sans-serif" font-weight="900" font-size="112" letter-spacing="6">1999</text>
    <text x="236" y="386" text-anchor="middle" fill="#E2F6C2" font-family="monospace, sans-serif" font-weight="900" font-size="118" letter-spacing="10">AI</text>
    <!-- Blinking CRT Block Cursor -->
    <rect x="332" y="304" width="40" height="84" fill="#E2F6C2" />
  </g>
</svg>
